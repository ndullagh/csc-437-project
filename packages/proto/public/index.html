<!doctype html>

<script type="importmap">
{
  "imports": {
    "@unbndl/html": "https://unpkg.com/@unbndl/html"
  }
}
</script>
<script type="module">
  import { define } from "@unbndl/html";
  import { ItemSlotElement } from "/js/item-slot.js";
  import { ItemTypeElement } from "/js/item-type.js"
  import { EquipmentElement } from "/js/equipment.js"

  define({
    "item-slot": ItemSlotElement,
    "item-type": ItemTypeElement,
    "equip-elem": EquipmentElement
  });
</script>


<html lang="en">
    <head>

        <title>Monster Hunter Set Builder</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" href="style/reset.css" />
        <link rel="stylesheet" href="style/style.css" />
        <link rel="stylesheet" href="style/index.css" />
    </head>
    <body>
        <div class="page">
            <header>
                <h1>Monster Hunter Set Builder</h1>
                <div class="utility-stuff">
                    <label onchange="relayEvent(
                                    event,
                                    'dark-mode',
                                    {checked: event.target.checked})">
                        <input type="checkbox" autocomplete="off" />
                        Dark mode
                    </label>
                    <svg class="icon">
                        <use href="sprite.svg#icon-avatar" />
                    </svg>
                    Noelle Dullaghan
                </div>
                
            </header>

                
            <h2>Equipment</h2>
            <equip-elem src="/data/equipment.json">
            </equip-elem>


        <script>
            /*const page = document.body;
            page.addEventListener("change", (event) => {
                const checked = event.target.checked;
                page.classList.toggle("dark-mode", checked);
            });*/
            function relayEvent(event, eventname, checked) {
                //if(event === "dark-mode") {
                    const customEvent = new CustomEvent(
                        "dark-mode:toggle", {
                        bubbles: true,
                        detail: checked,
                    });

                    event.target.dispatchEvent(customEvent);
                //}
                
            }

            document.body.addEventListener(
                "dark-mode:toggle",
                (event) => {
                    const page = event.currentTarget;
                    const checked = event.detail.checked;
                    page.classList.toggle("dark-mode", checked);

                }
            );
        </script>

        

        
    </body>

</html>
